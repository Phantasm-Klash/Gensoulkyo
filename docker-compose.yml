version: "3.8"

services:
  gensoulkyo:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    working_dir: /workspace/Gensoulkyo
    environment:
      GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    volumes:
      - .:/workspace/Gensoulkyo
      - ../PhK-Protocol:/workspace/PhK-Protocol:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    ports:
      - "7350:7350"
    command: ["go", "run", "./cmd/gensoulkyo", "-addr", "0.0.0.0:7350"]

  test:
    profiles:
      - test
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    volumes:
      - .:/workspace/Gensoulkyo
      - ../PhK-Protocol:/workspace/PhK-Protocol:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: ["go", "test", "./..."]

  # Builds the Nakama Go runtime plugin with the pluginbuilder that matches the
  # target Nakama server version, so the resulting .so passes Nakama's Go ABI
  # check. See deployments/nakama/ for the full self-hosted Nakama stack.
  nakama-tag-build:
    profiles:
      - nakama-tag-build
    image: heroiclabs/nakama-pluginbuilder:${NAKAMA_VERSION:-3.41.0}
    working_dir: /workspace/Gensoulkyo
    environment:
      GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
      GOSUMDB: ${GOSUMDB:-off}
    volumes:
      - .:/workspace/Gensoulkyo
      - ../PhK-Protocol:/workspace/PhK-Protocol:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command:
      - "build"
      - "-tags"
      - "nakama"
      - "-trimpath"
      - "-buildmode=plugin"
      - "-o"
      - "/workspace/Gensoulkyo/gensoulkyo.so"
      - "./cmd/gensoulkyo_nakama"

volumes:
  go-mod-cache:
  go-build-cache:
