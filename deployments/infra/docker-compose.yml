# Infra-only compose project for the Phantasm Klash gateway (thread B /
# pg-redis-persist). It owns the Redis instance that backs session presence,
# live room state, the matchmaking queue, rate limits and idempotency keys.
#
# Postgres is NOT here on purpose: it keeps living in the existing
# `gensoulkyo-nakama` compose project (container gensoulkyo_nakama_postgres,
# bridge address 192.168.32.2:5432) so that no existing volume or migration
# history is disturbed. See the "single instance, two databases" decision in
# docs/ or COORDINATION.md: `nakama_prod` and `nakama_test` are two databases
# inside that one Postgres container.
#
# Usage (from this directory):
#   cp .env.example .env   # then set REDIS_PASSWORD
#   docker compose up -d
#
# The password is interpolated from ./.env, which is git-ignored. Compose fails
# fast with `${REDIS_PASSWORD:?...}` when the file is missing.

name: gensoulkyo-infra

services:
  redis:
    image: redis:7-alpine
    container_name: gensoulkyo_redis
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      # Also read by the healthcheck below (as $$REDIS_PASSWORD in CMD-SHELL,
      # so compose does not try to interpolate it at parse time).
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deployments/infra/.env (see .env.example)}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in deployments/infra/.env (see .env.example)}
      # Durability: AOF (fsync every second) plus a periodic RDB snapshot.
      # The lobby survives a Redis restart because Postgres remains the
      # authoritative store; AOF only keeps the hot cache from being cold.
      - --appendonly
      - yes
      - --appendfsync
      - everysec
      - --save
      - "900"
      - "1"
      # Capacity guard on a 6 GiB host.
      - --maxmemory
      - 256mb
      # noeviction: every key we write is either authoritative-ish live state
      # (room/ticket/idempotency) or a safety valve (rate limit counters).
      # Silently evicting an idempotency key or a queue entry turns a duplicate
      # request into a duplicated side effect, which is far worse than an
      # explicit OOM error we can alert on.
      - --maxmemory-policy
      - noeviction
      - --maxmemory-samples
      - "5"
      - --tcp-keepalive
      - "60"
      - --loglevel
      - notice
    volumes:
      - redis_data:/data
    networks:
      # Same bridge as Postgres so the lobby (which runs on the host and
      # reaches Postgres at 192.168.32.2) can reach Redis the same way.
      # 192.168.32.3 is still held by the stopped gensoulkyo_nakama container,
      # so a high static address is used instead.
      gensoulkyo-nakama_default:
        ipv4_address: 192.168.32.10
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:

networks:
  # Real docker network name of the `gensoulkyo-nakama` compose project
  # (docker network ls shows the `_default` suffix).
  gensoulkyo-nakama_default:
    external: true
